<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Pandit Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
</head>
<body>
<div id="site-header"></div>
<main class="container">
  <div class="auth-wrap">
    <form class="pf-card p-4 p-sm-5" id="loginForm" novalidate>
      <div class="text-center mb-4"><img src="/images/logo.svg" alt="" width="56" height="56"><h1 class="h3 mt-2">Welcome back</h1><p class="text-muted small mb-0">Log in as a customer, pandit or administrator.</p></div>
      <div class="form-alert d-none"></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" name="email" autocomplete="email" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required></div>
      <div class="d-grid"><button class="btn btn-primary btn-lg" id="loginBtn">Log in</button></div>
      <p class="text-center small mt-3 mb-0">New here? <a href="/register.html">Create a customer account</a> · <a href="/become-pandit.html">Join as a pandit</a></p>
    </form>
  </div>
</main>
<div id="site-footer"></div>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
