<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Pandit Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
</head>
<body>
<div id="site-header"></div>
<main class="container">
  <div class="auth-wrap" style="max-width:520px">
    <form class="pf-card p-4 p-sm-5" id="registerForm" novalidate>
      <div class="text-center mb-4"><img src="/images/logo.svg" alt="" width="56" height="56"><h1 class="h3 mt-2">Create your account</h1><p class="text-muted small mb-0">Book pandits and manage your ceremonies.</p></div>
      <div class="form-alert d-none"></div>
      <div class="mb-3"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" name="name" autocomplete="name" required minlength="2" maxlength="100"></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" name="email" autocomplete="email" required></div>
      <div class="row g-3 mb-3">
        <div class="col-sm-6"><label class="form-label" for="phone">Phone <span class="text-muted small">(optional)</span></label><input class="form-control" id="phone" name="phone" autocomplete="tel" placeholder="+91 98765 43210"></div>
        <div class="col-sm-6"><label class="form-label" for="city">City <span class="text-muted small">(optional)</span></label><input class="form-control" id="city" name="city" list="cityList"><datalist id="cityList"></datalist></div>
      </div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input type="password" class="form-control" id="password" name="password" autocomplete="new-password" required minlength="8">
        <div class="form-text">At least 8 characters with letters and numbers.</div></div>
      <div class="mb-3"><label class="form-label" for="password2">Confirm password</label><input type="password" class="form-control" id="password2" name="password2" autocomplete="new-password" required></div>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="terms" required><label class="form-check-label small" for="terms">I agree to the <a href="/policies.html#terms" target="_blank">terms</a> and <a href="/policies.html#privacy" target="_blank">privacy policy</a>.</label></div>
      <div class="d-grid"><button class="btn btn-primary btn-lg" id="regBtn">Create account</button></div>
      <p class="text-center small mt-3 mb-0">Already registered? <a href="/login.html">Log in</a> · Are you a pandit? <a href="/become-pandit.html">Apply here</a></p>
    </form>
  </div>
</main>
<div id="site-footer"></div>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
